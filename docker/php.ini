expose_php = Off

; php.ini-production ships "GPCS", which leaves $_ENV empty. Container
; configuration arrives as real environment variables, so env() needs "E".
variables_order = "EGPCS"

memory_limit = 256M
max_execution_time = 60

; Livewire posts the whole component state on every interaction.
post_max_size = 16M
upload_max_filesize = 16M

; Application code never changes inside a running container, so opcache can
; skip stat() calls entirely. Rebuild the image to pick up code changes.
opcache.enable = 1
opcache.enable_cli = 1
; Measured on this app: ~52 MB of opcodes across ~795 scripts, and 12 MB of
; interned strings — the buffers below leave room for Volt/Livewire components
; that only get compiled once they are first requested.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 24
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Laravel writes to stderr; the container runtime collects it from there.
log_errors = On
error_log = /dev/stderr
display_errors = Off
